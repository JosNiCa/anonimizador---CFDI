[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfdi-dataset-sanitizer"
version = "1.1.0"
description = "Sanitizador local y determinista de CFDI 4.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "pypdf>=5,<7", "reportlab>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pyinstaller>=6"]

[project.scripts]
cfdi-sanitizer = "cfdi_sanitizer.cli:main"
cfdi-sanitizer-gui = "cfdi_sanitizer.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cfdi_sanitizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E701", "E702"]

[tool.mypy]
ignore_missing_imports = true
